<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <header class="py-12 px-6 text-center border-b border-gray-800">
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">Design Portfolio</h1>
    <p class="mt-3 text-gray-400 max-w-xl mx-auto">Graphic Design, Motion & Creative Visuals</p>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12">
    <div id="status" class="text-center text-amber-400 py-12 text-lg font-mono">डेटा लोड हो रहा है...</div>
    <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <script>
    // यहाँ अपना Google Sheet CSV लिंक डालें (सुनिश्चित करें कि अंत में &output=csv हो)
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQUD8ap4hxJ-7nnYuPNDuqTB9Mxn2qdvISmKd1mJ4UIkckWei7BICR5YJe-TLYYpvIEa-vbY0Uo7_Xv/pub?output=csv";

    function extractDriveId(url) {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                    url.match(/id=([a-zA-Z0-9_-]+)/) || 
                    url.match(/open\?id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : null;
    }

    async function loadPortfolio() {
      const status = document.getElementById('status');
      const gallery = document.getElementById('gallery');

      console.log("Fetching CSV from:", SHEET_CSV_URL);

      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          console.log("Data received:", results.data);
          const rows = results.data;
          
          if (!rows || rows.length <= 1) {
            status.innerText = "शीट से कनेक्ट हो गया, लेकिन कोई एंट्री नहीं मिली (Rows <= 1)। कृपया फॉर्म दोबारा सबमिट करें।";
            return;
          }

          status.style.display = 'none';
          gallery.innerHTML = '';

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            let mediaLink = "";
            let title = "";
            let desc = "";

            row.forEach(cell => {
              const text = String(cell).trim();
              if (text.startsWith("http://") || text.startsWith("https://")) {
                mediaLink = text;
              } else if (!title && text.length > 0 && isNaN(Date.parse(text))) {
                title = text;
              } else if (text.length > 0 && isNaN(Date.parse(text))) {
                desc = text;
              }
            });

            const card = document.createElement('div');
            card.className = "bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-lg flex flex-col";

            const ytId = extractYouTubeId(mediaLink);
            const driveId = extractDriveId(mediaLink);

            let mediaHtml = "";
            if (ytId) {
              mediaHtml = `<iframe class="w-full h-52" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe>`;
            } else if (driveId) {
              mediaHtml = `<img src="https://lh3.googleusercontent.com/d/${driveId}" alt="${title}" class="w-full h-52 object-cover bg-gray-800" onerror="this.src='https://drive.google.com/thumbnail?id=${driveId}&sz=w1000'">`;
            } else if (mediaLink) {
              mediaHtml = `<img src="${mediaLink}" alt="${title}" class="w-full h-52 object-cover bg-gray-800">`;
            } else {
              mediaHtml = `<div class="w-full h-52 bg-gray-800 flex items-center justify-center text-gray-500">No Image Link Found</div>`;
            }

            card.innerHTML = `
              ${mediaHtml}
              <div class="p-5 flex-1 flex flex-col justify-between">
                <div>
                  <h3 class="text-xl font-bold text-white">${title || "Untitled Project"}</h3>
                  <p class="text-gray-400 text-sm mt-2">${desc}</p>
                </div>
                <div class="mt-4 pt-3 border-t border-gray-800 text-xs text-gray-500 truncate">
                  ${mediaLink ? `<a href="${mediaLink}" target="_blank" class="text-blue-400 hover:underline">ओरिजिनल लिंक खोलें</a>` : 'कोई लिंक नहीं'}
                </div>
              </div>
            `;
            gallery.appendChild(card);
          }
        },
        error: function(err) {
          console.error("PapaParse Error:", err);
          status.innerText = "डेटा लोड एरर: " + JSON.stringify(err);
        }
      });
    }

    // सीधे फंक्शन को कॉल करें
    loadPortfolio();
  </script>
</body>
</html>
